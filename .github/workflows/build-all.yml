name: Build Linux Kernel

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
  schedule:
    # Twice a week: this repo exists to catch upstream distro/toolchain drift,
    # which happens whether or not anyone pushes, and GitHub drops caches that
    # go unused for 7 days, so weekly would lose the arch/manjaro ccache.
    - cron: '0 0 * * 1,4'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        linux: [debian, kalilinux, linux-mint, ubuntu,
          almalinux, amazonlinux,
          centos, centos8, fedora, mageia,
          opensuse, opensuse-leap, oraclelinux, rockylinux,
          openeuler, photon, altlinux,
          azurelinux, cbl-mariner, chimeralinux,
          alpine, gentoo, slackware, solus, void-linux,
          parrot, termux]
          # redhat: UBI repos lack bison/flex/dwarves; kernel cannot be built
          # without a RHEL subscription
    uses: ./.github/workflows/build.yml
    with:
      linux: ${{ matrix.linux }}

  # archlinux and manjarolinux build the same Arch PKGBUILD with the same gcc
  # most of the time, so they share one ccache (see build.yml). Running
  # manjarolinux after archlinux lets it start from the cache archlinux just
  # saved: only archlinux pays for a new kernel release, and neither job's
  # additions get lost to the other saving at the same time.
  archlinux:
    uses: ./.github/workflows/build.yml
    with:
      linux: archlinux

  manjarolinux:
    needs: archlinux
    # Still build Manjaro when the Arch job fails; only a cancel stops it.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build.yml
    with:
      linux: manjarolinux

