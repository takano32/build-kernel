name: Build Linux Kernel

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
  schedule:
    # Twice a week: this repo exists to catch upstream distro/toolchain drift,
    # which happens whether or not anyone pushes.
    - cron: '0 0 * * 1,4'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        linux: [debian, debian-12, devuan, kalilinux, linux-mint, ubuntu,
          ubuntu-24.04,
          almalinux, amazonlinux,
          centos, centos8, fedora, mageia,
          opensuse, opensuse-leap, oraclelinux, rockylinux,
          openeuler, photon, altlinux,
          archlinux, manjarolinux,
          azurelinux, cachyos, cbl-mariner, chimeralinux,
          alpine, gentoo, slackware, solus, void-linux,
          parrot, termux,
          miraclelinux, opencloudos, anolisos, wolfi, artixlinux,
          fedora-rawhide, debian-sid, alpine-edge, almalinux-kitten,
          gentoo-musl, gentoo-llvm, gentoo-musl-llvm, void-linux-musl,
          almalinux-8, openkylin, openmandriva, pureos]
          # redhat: UBI repos lack bison/flex/dwarves; kernel cannot be built
          # without a RHEL subscription
    uses: ./.github/workflows/build.yml
    # The sampler authenticates to ntfy with NTFY_TOKEN. A reusable workflow
    # does not see repository secrets unless the caller passes them on, and
    # without this the sampler quietly published anonymously (auth=anonymous
    # in the log) instead of failing.
    secrets: inherit
    with:
      linux: ${{ matrix.linux }}
