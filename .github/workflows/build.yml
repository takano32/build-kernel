on:
  workflow_call:
    inputs:
      linux:
        description: 'Name of Linux distribution to build Linux Kernel'
        default: ubuntu
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build docker image
        run: docker compose build ${{ inputs.linux }}
      - name: Build Linux Kernel
        run: >
          mkdir -p artifacts &&
          docker compose run --rm
          --env CI=$CI --service-ports
          -v "$PWD/artifacts:/build-kernel/artifacts"
          ${{ inputs.linux }}
      # entrypoint.sh copies .config into artifacts/ before compiling,
      # so `if: always()` still uploads the config of a failed build.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.linux }}
          path: artifacts/
          if-no-files-found: warn

