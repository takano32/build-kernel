on:
  workflow_call:
    inputs:
      linux:
        description: 'Name of Linux distribution to build Linux Kernel'
        default: ubuntu
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - name: Check out code
        uses: actions/checkout@v7
      # A job whose runner dies leaves no log at all (GET /actions/jobs/<id>/logs
      # answers 404 / BlobNotFound), so nothing about the death survives on
      # GitHub's side. gentoo-llvm died this way on 10-05, 10-08 and 10-20, each
      # time around 70 minutes in, with no way to tell memory pressure from a
      # full disk. Run .github/scripts/sampler.sh next to the build: it posts
      # memory/disk/PSI to ntfy.sh once a minute, and the last post is the state
      # the runner died in. Read it with: curl -s https://ntfy.sh/<topic>/json
      - name: Build docker image
        env:
          SAMPLE_TOPIC: build-kernel-9f3a1c7b2e
          SAMPLE_LABEL: image:${{ inputs.linux }}
          SAMPLE_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # The gentoo images copy the whole portage tree and then emerge a lot.
          # On 2026-10-25 that build took dockerd's own RSS from 580MB to 11GB
          # in a single minute (sampler: mem 12.6/16GB, psi_mem avg10 8.57) and
          # the runner was gone with "lost communication" right after -- the
          # death this repository has been chasing since 10-05. Build the
          # gentoo family with the legacy builder, which commits one layer at a
          # time instead of holding the export in the daemon, and leave every
          # other distro on BuildKit.
          DOCKER_BUILDKIT: ${{ contains(inputs.linux, 'gentoo') && '0' || '1' }}
        run: |
          bash .github/scripts/sampler.sh &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          docker compose build ${{ inputs.linux }}
      - name: Build Linux Kernel
        env:
          SAMPLE_TOPIC: build-kernel-9f3a1c7b2e
          SAMPLE_LABEL: kernel:${{ inputs.linux }}
          SAMPLE_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          bash .github/scripts/sampler.sh &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          mkdir -p artifacts
          docker compose run --rm \
            --env CI=$CI --service-ports \
            -v "$PWD/artifacts:/build-kernel/artifacts" \
            ${{ inputs.linux }}
      # A failing job announces itself here: one POST per failure with the
      # distro, the conclusion and the run URL. The sampler's minute-by-minute
      # stream is for the runner that dies (its posts just stop); this is for
      # the ordinary failures, which are silent otherwise.
      - name: Notify failure
        if: failure() || cancelled()
        env:
          SAMPLE_TOPIC: build-kernel-9f3a1c7b2e
          SAMPLE_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          msg="FAILED ${{ inputs.linux }} (${{ job.status }}) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
            -H "Authorization: Bearer $SAMPLE_TOKEN" \
            -H "Title: build-kernel: ${{ inputs.linux }} ${{ job.status }}" \
            -H "Priority: high" -H "Tags: warning" \
            -d "$msg" "https://ntfy.sh/$SAMPLE_TOPIC") || code=000
          echo "notified: $code $msg"
      # entrypoint.sh copies .config into artifacts/ before compiling,
      # so `if: always()` still uploads the config of a failed build.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.linux }}
          path: artifacts/
          if-no-files-found: warn
